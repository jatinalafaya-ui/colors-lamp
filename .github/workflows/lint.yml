name: Lint

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        language: [html, css, js]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js for lint tools
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install lint tools
        run: npm ci
      - name: Check ${{ matrix.language }} files
        run: npm run lint:${{ matrix.language }}
